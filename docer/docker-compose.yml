version: '3.8'

services:
  product-service:
    build: ./product_service
    container_name: product-service
    ports:
      - "8001:8000" # Доступен на хосте по 8001

  discount-service:
    build: ./discount_service
    container_name: discount-service
    ports:
      - "8003:8000" # Доступен на хосте по 8003

  order-service:
    build: ./order_service
    container_name: order-service
    ports:
      - "8002:8000" # Главная точка входа для пользователя
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - DISCOUNT_SERVICE_URL=http://discount-service:8000
    depends_on:
      - product-service
      - discount-service